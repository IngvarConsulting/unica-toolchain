name: Verify toolchain source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python -m py_compile scripts/*.py toolchain/*.py toolchain/builders/*.py tests/*.py
      - name: Validate every pinned source and license set
        shell: bash
        run: |
          set -euo pipefail
          for manifest in manifests/*.json; do
            tool="$(basename "$manifest" .json)"
            python scripts/toolchain.py validate-source \
              --manifest "$manifest" \
              --repo-root . \
              --work-dir ".build/ci-${tool}" \
              --out-dir "dist/ci-${tool}"
          done
      - name: Validate GitHub Actions syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  rlm-standalone-smoke:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x64
            runner: ubuntu-latest
          - target: win-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Build, extract, and smoke the frozen RLM archive
        shell: bash
        run: >-
          python scripts/toolchain.py build --manifest manifests/rlm-tools-bsl.json
          --repo-root .
          --target "${{ matrix.target }}"
          --work-dir ".build/ci-rlm-tools-bsl-${{ matrix.target }}"
          --out-dir "dist/ci-rlm-tools-bsl-${{ matrix.target }}"
      - name: Emit target provenance and checksum
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "dist/ci-rlm-tools-bsl-${{ matrix.target }}/provenance-rlm-tools-bsl-${{ matrix.target }}.json"
          cat "dist/ci-rlm-tools-bsl-${{ matrix.target }}/checksums-rlm-tools-bsl-${{ matrix.target }}.txt"
